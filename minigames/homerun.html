<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>홈런볼 모으기 — 불펜장</title>
<!-- SSG 팬 레디코더의 문학야구장 — 출처를 남겨 주세요('SSG 팬 레디코더의 문학야구장 참조'). 판매·유료 사용은 안 돼요. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/mg.css">
<link rel="stylesheet" href="shared/ball.css">
<link rel="stylesheet" href="homerun/homerun.css">
</head>
<body>
<header class="mgbar">
  <button class="cap" id="back" aria-label="불펜장으로"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <h1>홈런볼 모으기</h1>
  <a class="cap" href="locker.html#balls" aria-label="공박스"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M7 7c2 3 2 7 0 10M17 7c-2 3-2 7 0 10"/></svg></a>
</header>
<main class="wrap">
  <div class="strip" aria-live="polite">
    <div class="when" id="hrWhen"><span class="d" id="hrDate">개막 준비</span><span class="o" id="hrOpp"></span><span class="chip" id="hrChip" hidden></span></div>
    <span class="cnt" id="hrCnt"></span>
  </div>
  <div class="field">
    <canvas id="hrCanvas" tabindex="0" aria-label="외야 관중석. 글러브를 좌우로 움직여 공을 잡아요"></canvas>
    <div class="pop" id="hrPop"></div>
    <div class="msg" id="hrMsg"></div>
    <div class="gate" id="hrGate">
      <h3 id="gateTitle"></h3>
      <p id="gateText"></p>
      <button class="primary" id="hrStart">시작</button>
    </div>
  </div>
  <p class="howto">글러브를 좌우로 끌어 공 그림자 위에 두면 잡혀요. 공이 떨어지는 순간 화면을 누르면 나이스 캐치!</p>

  <section class="dev" id="dev" hidden>
    확인용 버튼이에요. 주소에 ?dev 가 있을 때만 보여요.
    <div class="row">
      <button class="secondary" id="dFill">공 40개 채우기</button>
      <button class="secondary" id="dBreak">올스타 직전까지 채우기</button>
      <button class="secondary" id="dAS">올스타 장면 바로 보기</button>
      <button class="secondary" id="dGround">그라운드 홈런 바로 보기</button>
      <button class="secondary" id="dReset">공박스 비우기</button>
    </div>
  </section>
</main>

<div class="overlay" id="hrResult" role="dialog" aria-modal="true" aria-labelledby="hrrTitle">
  <div class="sheet">
    <h3 id="hrrTitle"></h3>
    <p id="hrrMsg"></p>
    <div class="result"><div>잡은 공<b id="hrrCaught"></b></div><div>나이스 캐치<b id="hrrNice"></b></div><div>시즌<b id="hrrSeason"></b></div></div>
    <div class="row"><a class="secondary" href="locker.html#balls">공박스 보기</a><button class="primary" id="hrrNext">다음 판</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="shared/store.js"></script>
<script src="shared/card.js"></script>
<script src="shared/roster.js"></script>
<script src="shared/homeruns.js"></script>
<script src="shared/ball.js"></script>
<script src="homerun/scene.js"></script>
<script src="homerun/cutscene.js"></script>
<script src="homerun/game.js"></script>
</body>
</html>
