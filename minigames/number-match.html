<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>등번호 매치 — 불펜장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/mg.css">
<link rel="stylesheet" href="shared/card.css">
<link rel="stylesheet" href="number-match/game.css">
</head>
<body>
<header class="mgbar">
  <button class="cap" id="back" aria-label="불펜장으로"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <h1>등번호 매치</h1>
  <a class="cap" href="locker.html#cards" aria-label="카드 앨범"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="11" height="15" rx="2"/><path d="M8 3h10a2 2 0 0 1 2 2v13"/></svg></a>
</header>
<main class="wrap">
  <div class="stats">
    <span>시간<b id="time">0:00</b></span>
    <span>뒤집기<b id="moves">0</b></span>
    <span>카드 앨범<b id="count">0</b></span>
  </div>
  <div class="board" id="board"></div>
  <p class="howto">같은 선수의 등번호 카드와 이름 카드를 찾아 짝지어요.</p>
  <div class="actions"><button class="secondary" id="restart">새 판 시작</button></div>

  <section class="dev" id="dev" hidden>
    확인용 버튼이에요. 주소에 ?dev 가 있을 때만 보여요.
    <div class="row">
      <button class="secondary" id="dLegend">레전더리 나오는 판</button>
      <button class="secondary" id="dPeek">카드 전부 보기</button>
      <button class="secondary" id="dAlmost">1장 남기고 모으기</button>
      <button class="secondary" id="dReset">카드 앨범 비우기</button>
    </div>
  </section>
</main>

<div class="overlay" id="result" role="dialog" aria-modal="true" aria-labelledby="rT">
  <div class="sheet">
    <h3 id="rT">몸 다 풀었어요</h3>
    <p id="rMsg"></p>
    <div class="result"><div>시간<b id="rTime"></b></div><div>뒤집기<b id="rMoves"></b></div><div>카드 앨범<b id="rCount"></b></div></div>
    <div class="newrow" id="rNew"></div>
    <div class="row"><a class="secondary" href="locker.html#cards">카드 앨범 보기</a><button class="primary" id="rAgain">한 판 더</button></div>
  </div>
</div>

<div class="overlay" id="ending" role="dialog" aria-modal="true" aria-labelledby="eT">
  <canvas id="confetti"></canvas>
  <div class="final">
    <div class="trophy" aria-hidden="true">🏆</div>
    <h3 id="eT">덱 완성</h3>
    <p>랜더스 선수 전부를 카드 앨범에 모았어요.<br>다음 시즌, 문학에서 만나요.</p>
    <button class="primary" id="endClose">카드 앨범 보기</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="shared/store.js"></script>
<script src="shared/roster.js"></script>
<script src="shared/players.js"></script>
<script src="shared/card.js"></script>
<script src="number-match/game.js"></script>
</body>
</html>
