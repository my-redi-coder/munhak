<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="비시즌에 들어가 다음 시즌을 상상하는 곳, 문학. 봄을 기다리기.">
<title>문학 - 봄을 기다리기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/boot.css">
<link rel="stylesheet" href="styles/setup.css">
<link rel="stylesheet" href="styles/hud.css">
<link rel="stylesheet" href="styles/sheets.css">
<link rel="stylesheet" href="styles/event.css">
<link rel="stylesheet" href="styles/bullpen.css">
</head>
<body>
<canvas id="c" tabindex="0" aria-label="문학야구장 3D 화면"></canvas>

<main class="boot" id="boot" role="status" aria-label="문학">
  <span class="mark" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M7.6 4.3c1.9 2.3 1.9 13.1 0 15.4M16.4 4.3c-1.9 2.3-1.9 13.1 0 15.4"/></svg></span>
  <h1>문학</h1>
  <p id="bootMsg">그라운드를 여는 중</p>
  <span class="dot" aria-hidden="true"></span>
</main>

<div id="fade" aria-hidden="true"><span id="fadeMsg"></span></div>

<section id="setup" hidden aria-label="입장 준비">
  <div class="setup-mark" aria-hidden="true"><b>문학</b><span>봄을 기다리기</span></div>
  <div class="sheet">
    <div class="step" id="step1">
      <div class="who">
        <div class="nm"><small>오늘의 나</small><span id="meName">기쁜 으쓱이</span></div>
        <button class="iconbtn" id="reroll" aria-label="이름 다시 뽑기"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="9" cy="9" r=".9" fill="currentColor"/><circle cx="15" cy="9" r=".9" fill="currentColor"/><circle cx="9" cy="15" r=".9" fill="currentColor"/><circle cx="15" cy="15" r=".9" fill="currentColor"/></svg></button>
      </div>
      <div class="field">
        <span id="uniLbl">유니폼</span>
        <div class="swatches" role="radiogroup" aria-labelledby="uniLbl" id="swatches"></div>
      </div>
      <div class="field">
        <span>등판</span>
        <div class="back-row">
          <input id="inName" maxlength="8" placeholder="선수명" autocomplete="off" aria-label="등판 선수명">
          <input id="inNum" maxlength="2" inputmode="numeric" placeholder="번호" autocomplete="off" aria-label="등번호">
        </div>
        <p class="help">뒷모습에 바로 보여요. 화면을 끌어 돌려 볼 수 있어요.</p>
      </div>
      <button class="primary" id="toStep2">다음</button>
    </div>
    <div class="step" id="step2" hidden>
      <button class="linkback" id="toStep1"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>으쓱이 꾸미기</button>
      <h2>어디에 앉을까요</h2>
      <div class="zones" role="radiogroup" aria-label="구역" id="zoneList"></div>
      <button class="primary" id="enter">입장하기</button>
    </div>
  </div>
</section>

<section id="hud" hidden>
  <div class="top">
    <div class="left">
      <div class="cap"><button id="bExit" aria-label="나가기"><svg class="i" viewBox="0 0 24 24"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/></svg></button></div>
      <div class="cap"><button id="bZone" aria-haspopup="dialog"><svg class="i" viewBox="0 0 24 24"><path d="M7 4h10v8H7zM5 12h14M7 12v8M17 12v8"/></svg><span id="zoneName">으쓱이존</span><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M6 9l6 6 6-6"/></svg></button></div>
    </div>
    <div class="right">
      <div class="cap">
        <span class="stat" aria-label="1루 관중 수"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5a3 3 0 0 1 0 6M21 20c0-2.8-1.9-5.2-4.5-5.8"/></svg><span id="crowdN">0</span></span>
        <button id="bSound" aria-label="소리 끄기"><svg class="i" viewBox="0 0 24 24" id="sndIco"></svg></button>
        <button id="bSet" aria-label="설정" aria-haspopup="dialog"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
        <button id="bPhoto" aria-label="직관 사진"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      </div>
      <div class="row2"><button class="pill" id="bLook" aria-label="경기장 구경하기"><svg class="i" viewBox="0 0 24 24"><circle cx="7" cy="15" r="3.5"/><circle cx="17" cy="15" r="3.5"/><path d="M10.5 15h3M4.5 12.5L7 6h3l.8 6.5M19.5 12.5L17 6h-3l-.8 6.5"/></svg>구경</button>
      <button class="pill" id="bEvent"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="2"/></svg>이벤트</button>
      <button class="pill" id="bBullpen" aria-haspopup="dialog"><svg class="i" viewBox="0 0 24 24"><path d="M4 18c3-1.6 5-1.6 8 0s5 1.6 8 0"/><ellipse cx="12" cy="14" rx="7" ry="2.2"/><path d="M10.6 12h2.8"/><circle cx="12" cy="6.5" r="2.6"/></svg>불펜장</button></div>
      <div class="cap seg" role="group" aria-label="그라운드 공격·수비"><button id="bAtk" aria-pressed="false">공격</button><button id="bDef" aria-pressed="false">수비</button></div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div class="bottom">
    <div id="status" hidden><span id="statusTx">걷는 중</span><button id="statusStop">멈추기</button></div>
    <nav class="bar" aria-label="행동">
      <button class="act" data-act="cheer" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 10v4h3l8 5V5L7 10z"/><path d="M18.5 9a4 4 0 0 1 0 6"/></svg><span>응원하기</span></button>
      <button class="act" data-act="angry" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M8.5 10.5l2.2 1.1M15.5 10.5l-2.2 1.1M9.2 17c1.7-1.2 3.9-1.2 5.6 0M17 2.5l2.5 2.5M19.5 2.5L17 5"/></svg><span>화내기</span></button>
      <button class="act" data-act="wave" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M8.5 4L4 6.5l1.8 3.6 2.4-.9V20h7.6V9.2l2.4.9L20 6.5 15.5 4c-.6 1.4-1.9 2.2-3.5 2.2S9.1 5.4 8.5 4z"/></svg><span>유니폼 흔들기</span></button>
      <button class="act" data-act="food" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 12h17a8.5 8.5 0 0 1-17 0zM9 8.5c0-1.8 1.6-1.8 1.6-3.5M13.4 8.5c0-1.8 1.6-1.8 1.6-3.5"/></svg><span>야푸먹기</span></button>
    </nav>
  </div>
</section>

<section id="food" hidden role="dialog" aria-modal="true" aria-labelledby="foodT">
  <div class="fd-top"><h2 id="foodT">야푸먹기</h2><span class="fd-where" id="fdWhere"></span><button class="iconbtn" id="fdClose" aria-label="야푸먹기 닫기"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <p class="fd-hint" id="fdHint" role="status" aria-live="polite"></p>
  <div class="fd-stage"><svg class="fd-tbl" id="fdTbl" viewBox="0 0 360 400" role="group" aria-label="내 자리 앞 테이블"></svg></div>
  <div class="fd-foot"><div class="fd-log" id="fdLog"></div><button class="primary" id="fdOrder">주문하기</button></div>
  <div class="fd-sheet" id="fdSheet" hidden role="dialog" aria-labelledby="fdSheetT">
    <h3 id="fdSheetT">뭐 먹을까요<button class="iconbtn" id="fdSheetX" aria-label="주문 닫기"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3>
    <div id="fdOpts" style="display:flex;flex-direction:column;gap:8px"></div>
    <button class="primary" id="fdGo" disabled>주문하기</button>
  </div>
</section>

<div id="labels" aria-hidden="true"></div>
<div id="letterbox" aria-hidden="true"><i></i><i></i></div>

<div class="modal" id="mZone" hidden role="dialog" aria-modal="true" aria-labelledby="mZoneT">
  <div class="panel">
    <header><h3 id="mZoneT">구역 선택</h3><button class="iconbtn" data-close aria-label="구역 선택 닫기"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="zones" id="zoneList2"></div>
    <p class="help">구역을 고르면 그 구역 통로로 옮겨요.</p>
  </div>
</div>

<div class="modal" id="mSet" hidden role="dialog" aria-modal="true" aria-labelledby="mSetT">
  <div class="panel">
    <header><h3 id="mSetT">설정</h3><button class="iconbtn" data-close aria-label="설정 닫기"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <h4>내가 듣는 소리</h4>
    <div class="slider"><label for="vAmb">관중 함성</label><input id="vAmb" type="range" min="0" max="100"><output id="oAmb"></output></div>
    <div class="slider"><label for="vBeat">응원 비트</label><input id="vBeat" type="range" min="0" max="100"><output id="oBeat"></output></div>
    <div class="slider"><label for="vSfx">효과음</label><input id="vSfx" type="range" min="0" max="100"><output id="oSfx"></output></div>
  </div>
</div>

<div class="modal" id="mEvent" hidden role="dialog" aria-modal="true" aria-labelledby="mEventT">
  <div class="panel">
    <header><h3 id="mEventT">이벤트</h3><button class="iconbtn" data-close aria-label="이벤트 닫기"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="zones" id="eventList"></div>
    <p class="help">나에게만 보이는 장면이에요. 주변 으쓱이는 같이 반응해요.</p>
  </div>
</div>

<section id="bullpen" hidden role="dialog" aria-modal="true" aria-label="불펜장">
  <iframe id="bullpenFrame" title="불펜장" src="about:blank"></iframe>
</section>

<section id="bye" hidden>
  <svg class="i" viewBox="0 0 24 24" style="width:30px;height:30px;color:#b0533f;stroke-width:1.1"><circle cx="12" cy="12" r="9"/><path d="M7.6 4.3c1.9 2.3 1.9 13.1 0 15.4M16.4 4.3c-1.9 2.3-1.9 13.1 0 15.4"/></svg>
  <h2>재밌게 놀다 가셨나요</h2>
  <p>봄에 문학에서 만나요.</p>
  <button class="primary" id="again">다시 입장하기</button>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/config.js"></script>
<script src="songs/songs.js"></script>
<script src="js/engine/renderer.js"></script>
<script src="js/world/sky.js"></script>
<script src="js/world/field.js"></script>
<script src="js/world/props.js"></script>
<script src="js/world/landmarks.js"></script>
<script src="js/world/bigboard.js"></script>
<script src="js/world/bbshow.js"></script>
<script src="js/world/stands.js"></script>
<script src="js/world/greenzone.js"></script>
<script src="js/world/hogbanner.js"></script>
<script src="js/world/bbq.js"></script>
<script src="js/world/crowd.js"></script>
<script src="js/entities/character.js"></script>
<script src="js/entities/player.js"></script>
<script src="js/audio/audio.js"></script>
<script src="js/audio/songs.js"></script>
<script src="js/audio/eventsfx.js"></script>
<script src="js/audio/evbgm.js"></script>
<script src="js/game/state.js"></script>
<script src="js/ui/feedback.js"></script>
<script src="js/ui/setup.js"></script>
<script src="js/game/flow.js"></script>
<script src="js/game/actions.js"></script>
<script src="js/ui/sheets.js"></script>
<script src="js/game/npc.js"></script>
<script src="js/game/fieldplay.js"></script>
<script src="js/game/events.js"></script>
<script src="events/homer.js"></script>
<script src="events/kkk.js"></script>
<script src="events/yeonan.js"></script>
<script src="js/ui/fieldmode.js"></script>
<script src="js/ui/event-sheet.js"></script>
<script src="js/ui/food.js"></script>
<script src="js/ui/bullpen.js"></script>
<script src="js/game/input.js"></script>
<script src="js/game/camera.js"></script>
<script src="js/game/sightsee.js"></script>
<script src="js/game/movement.js"></script>
<script src="js/world/petals.js"></script>
<script src="js/app/loop.js"></script>
<script src="js/app/boot.js"></script>
</body>
</html>
